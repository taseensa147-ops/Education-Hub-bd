<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Identity Services SDK -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen p-4">

  <div class="w-full max-w-md bg-white rounded-2xl shadow-lg border border-gray-100 p-8">
    <!-- Header -->
    <div class="text-center mb-8">
      <h1 class="text-2xl font-bold text-gray-900">Create an account</h1>
      <p class="text-sm text-gray-500 mt-1">Start your 30-day free trial</p>
    </div>

    <!-- Google Sign-Up Container -->
    <div class="mb-6 flex justify-center">
      <div id="g_id_onload"
           data-client_id="YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com"
           data-callback="handleCredentialResponse"
           data-auto_prompt="false">
      </div>
      
      <button id="google-signin-btn" class="w-full flex items-center justify-center gap-3 py-2.5 px-4 border border-gray-300 rounded-lg text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 transition">
        <svg class="w-5 h-5" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3h3.88c2.27-2.09 3.665-5.17 3.665-9.12z"/>
          <path fill="#34A853" d="M12 24c3.24 0 6-.1 7.9-2.82l-3.88-3c-1.08.72-2.45 1.16-4.02 1.16-3.09 0-5.71-2.09-6.64-4.91H1.36v3.1C3.33 21.46 7.38 24 12 24z"/>
          <path fill="#FBBC05" d="M5.36 14.43c-.24-.72-.38-1.49-.38-2.43s.14-1.71.38-2.43V6.47H1.36C.49 8.2.0 10.04.0 12s.49 3.8 1.36 5.53l4-3.1z"/>
          <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24.0 12 .0 7.38.0 3.33 2.54 1.36 6.47l4 3.1c.93-2.82 3.55-4.82 6.64-4.82z"/>
        </svg>
        Sign up with Google
      </button>
    </div>

    <!-- Divider -->
    <div class="relative flex items-center justify-center mb-6">
      <div class="border-t border-gray-200 w-full"></div>
      <span class="bg-white px-3 text-xs text-gray-400 uppercase tracking-wider absolute">or</span>
    </div>

    <!-- Form -->
    <form action="#" method="POST" class="space-y-4">
      <div>
        <label for="fullname" class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1">Full Name</label>
        <input 
          type="text" 
          id="fullname" 
          name="fullname" 
          required 
          placeholder="John Doe" 
          class="w-full px-3.5 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition"
        />
      </div>

      <div>
        <label for="email" class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1">Email Address</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          required 
          placeholder="name@company.com" 
          class="w-full px-3.5 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition"
        />
      </div>

      <div>
        <label for="password" class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1">Password</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          required 
          placeholder="Must be at least 8 characters" 
          class="w-full px-3.5 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition"
        />
      </div>

      <div class="flex items-center">
        <input 
          type="checkbox" 
          id="terms" 
          name="terms" 
          required
          class="h-4 w-4 text-indigo-600 focus:ring-indigo-500 border-gray-300 rounded cursor-pointer"
        />
        <label for="terms" class="ml-2 block text-sm text-gray-600 cursor-pointer">
          I agree to the <a href="#" class="text-indigo-600 hover:text-indigo-500">Terms of Service</a> and <a href="#" class="text-indigo-600 hover:text-indigo-500">Privacy Policy</a>
        </label>
      </div>

      <button 
        type="submit" 
        class="w-full bg-indigo-600 text-white font-medium py-2.5 px-4 rounded-lg hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 transition shadow-sm"
      >
        Create Account
      </button>
    </form>

    <!-- Footer Link -->
    <p class="text-center text-sm text-gray-500 mt-6">
      Already have an account? 
      <a href="./login.html" class="text-indigo-600 hover:text-indigo-500 font-medium">Sign in</a>
    </p>
  </div>

  <script src="./auth.js"></script>
</body>
</html>
