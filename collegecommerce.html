<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopathi - Home</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --secondary: #06b6d4;
            --accent: #f59e0b;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --card-bg: rgba(255, 255, 255, 0.08);
            --card-border: rgba(255, 255, 255, 0.15);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        /* Mobile App Container */
        .app-container {
            width: 100%;
            max-width: 430px;
            height: 900px;
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 32px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
            position: relative;
        }

        /* Header Navigation */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.25rem 1.25rem 0.75rem 1.25rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .brand-name {
            font-size: 1.4rem;
            font-weight: 700;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .sp-coin-btn {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            background: rgba(245, 158, 11, 0.15);
            border: 1px solid rgba(245, 158, 11, 0.4);
            padding: 0.35rem 0.6rem;
            border-radius: 20px;
            color: var(--accent);
            font-size: 0.8rem;
            font-weight: 600;
            text-decoration: none;
            transition: transform 0.2s;
        }

        .sp-coin-btn:hover {
            transform: scale(1.05);
        }

        .icon-btn {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 0.9rem;
            transition: background 0.3s;
        }

        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        /* App Content Area */
        .app-content {
            flex: 1;
            overflow-y: auto;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .app-content::-webkit-scrollbar {
            width: 4px;
        }
        .app-content::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }

        /* Top Hero Card: Progress & Dynamic Streak Calendar */
        .hero-tracker-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 1rem;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
        }

        .progress-side {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            text-align: center;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            padding-right: 0.5rem;
        }

        .topic-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: #38bdf8;
            margin-bottom: 0.5rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 130px;
        }

        .circular-progress {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: conic-gradient(var(--secondary) 270deg, rgba(255, 255, 255, 0.1) 0deg);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0.25rem 0;
        }

        .circular-progress-inner {
            width: 66px;
            height: 66px;
            border-radius: 50%;
            background: #0f172a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: 700;
        }

        .circular-progress-inner span {
            font-size: 0.6rem;
            color: var(--text-muted);
            font-weight: 400;
        }

        .btn-continue {
            margin-top: 0.5rem;
            width: 100%;
            padding: 0.4rem 0.6rem;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 0.75rem;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
            transition: transform 0.2s;
            text-align: center;
        }

        .btn-continue:hover {
            transform: translateY(-2px);
        }

        /* Dynamic Streak Calendar Side */
        .streak-side {
            display: flex;
            flex-direction: column;
        }

        .streak-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.4rem;
        }

        .streak-title {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .month-name {
            font-size: 0.65rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .mini-calendar {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
            text-align: center;
        }

        .cal-day-head {
            font-size: 0.55rem;
            color: var(--text-muted);
            font-weight: 600;
            padding-bottom: 2px;
        }

        .cal-date {
            font-size: 0.6rem;
            padding: 2px 0;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.03);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 18px;
            color: var(--text-muted);
        }

        .cal-date.empty {
            background: transparent;
        }

        .cal-date.active {
            background: rgba(245, 158, 11, 0.2);
            color: var(--accent);
        }

        .cal-date.today-logged {
            background: rgba(245, 158, 11, 0.35);
            border: 1px solid var(--accent);
            color: var(--accent);
            font-weight: 700;
        }

        /* Mission & Achievement Row */
        .action-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
        }

        .action-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 0.85rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            text-decoration: none;
            color: var(--text-main);
            transition: border-color 0.3s, transform 0.2s;
        }

        .action-card:hover {
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
        }

        .action-card i {
            font-size: 1.2rem;
        }

        .action-card.mission i { color: #f43f5e; }
        .action-card.achievement i { color: #eab308; }

        .action-card span {
            font-size: 0.85rem;
            font-weight: 600;
        }

        /* What Do You Want to Study */
        .section-header {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
            color: #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .subjects-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.75rem;
        }

        .subject-box {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 0.85rem 0.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.4rem;
            text-decoration: none;
            color: var(--text-main);
            font-size: 0.75rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .subject-box:hover {
            border-color: #38bdf8;
            background: rgba(56, 189, 248, 0.1);
            transform: translateY(-2px);
        }

        .subject-box i {
            font-size: 1.25rem;
            color: #38bdf8;
        }

        /* Enhanced Interactive Leaderboard Card */
        .leaderboard-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 1rem;
            text-decoration: none;
            color: inherit;
            display: block;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .leaderboard-card:hover {
            border-color: rgba(234, 179, 8, 0.5);
            background: rgba(255, 255, 255, 0.12);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(234, 179, 8, 0.15);
        }

        .leaderboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .view-all-link {
            font-size: 0.75rem;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 0.25rem;
            font-weight: 500;
        }

        .leaderboard-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .leader-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.4rem 0.6rem;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            font-size: 0.75rem;
        }

        .leader-info {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .rank {
            font-weight: 700;
            width: 16px;
            color: var(--text-muted);
        }

        .rank.top1 { color: #eab308; }
        .rank.top2 { color: #94a3b8; }
        .rank.top3 { color: #b45309; }

        /* Footer Navigation Bar */
        .app-footer {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            background: rgba(15, 23, 42, 0.95);
            border-top: 1px solid var(--card-border);
            padding: 0.6rem 0;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.2rem;
            text-decoration: none;
            color: var(--text-muted);
            font-size: 0.65rem;
            font-weight: 500;
            transition: color 0.3s;
        }

        .nav-item i {
            font-size: 1.1rem;
        }

        .nav-item.active {
            color: #38bdf8;
        }
    </style>
</head>
<body>

        </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderLiveCalendar();
        });

        function renderLiveCalendar() {
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth();
            const todayDate = now.getDate();

            // Set Month Name in Header
            const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
            document.getElementById('calendarMonth').innerText = `${monthNames[month]} ${year}`;

            const calendarGrid = document.getElementById('calendarGrid');
            calendarGrid.innerHTML = '';

            // Add Day Headers
            const dayHeaders = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
            dayHeaders.forEach(day => {
                const headDiv = document.createElement('div');
                headDiv.className = 'cal-day-head';
                headDiv.innerText = day;
                calendarGrid.appendChild(headDiv);
            });

            // Calculate First Day and Days in Month
            const firstDayIndex = new Date(year, month, 1).getDay();
            const totalDays = new Date(year, month + 1, 0).getDate();

            // Simulate login streak dates (e.g. past dates before today)
            const streakDates = new Set();
            for (let i = Math.max(1, todayDate - 11); i < todayDate; i++) {
                streakDates.add(i);
            }
            // Add today as logged in automatically
            streakDates.add(todayDate);

            // Padding for previous month days
            for (let i = 0; i < firstDayIndex; i++) {
                const emptyDiv = document.createElement('div');
                emptyDiv.className = 'cal-date empty';
                calendarGrid.appendChild(emptyDiv);
            }

            // Fill actual month dates
            for (let day = 1; day <= totalDays; day++) {
                const dateDiv = document.createElement('div');
                dateDiv.className = 'cal-date';

                if (day === todayDate) {
                    dateDiv.classList.add('today-logged');
                    dateDiv.innerHTML = `<i class="fa-solid fa-fire"></i>`;
                } else if (streakDates.has(day)) {
                    dateDiv.classList.add('active');
                    dateDiv.innerHTML = `<i class="fa-solid fa-fire"></i>`;
                } else {
                    dateDiv.innerText = day;
                }

                calendarGrid.appendChild(dateDiv);
            }
        }
    </script>
